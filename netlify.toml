# Netlify configuration for Maîtrise Énergie.
#
# Required environment variables (Site settings → Environment variables):
#   Build + runtime (client / prerender / sitemap):
#     VITE_SUPABASE_URL          https://<ref>.supabase.co
#     VITE_SUPABASE_ANON_KEY     <anon key>
#     VITE_SITE_URL              https://<production-domain>
#     SITE_URL                   https://<production-domain>
#   Functions only (never prefixed with VITE_):
#     SUPABASE_URL               https://<ref>.supabase.co
#     SUPABASE_SERVICE_ROLE_KEY  <service role key>
#     OPENAI_CONVERSIONS_API_KEY <Conversions API key; server secret>
#     OPENAI_ADS_PIXEL_ID        52KLrR3qwRDL3WJyDtXN5Z (optional override)
#     ADMIN_ACCESS_CODE          <long random code for the /admin back office>

[build]
  command = "npm run build:ssg"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Origine publique utilisée par le sitemap, robots.txt et les balises canonical.
  # (Les variables définies dans le dashboard Netlify restent prioritaires.)
  SITE_URL = "https://maitrise-energie.fr"
  VITE_SITE_URL = "https://maitrise-energie.fr"

[functions]
  node_bundler = "esbuild"

# Assets emitted by Vite carry a content hash. They can therefore be retained
# indefinitely by the browser and the CDN without risking stale application
# code after a deployment.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo-mark-64.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand-mark.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-social.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API routes are handled by Netlify Functions (v2 `path` config) — keep them
# ahead of the SPA fallback.
[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin-api"
  status = 200

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200

[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200

# "Blog" was merged into "Ressources" — preserve any existing links/indexing.
[[redirects]]
  from = "/blog"
  to = "/ressources"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/ressources/:splat"
  status = 301

# Prerendered pages are static files in dist/ and are served as-is.
# Everything else falls back to the SPA shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
